
<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#090b12">
<title>Admin Poster - Teater Mini Sibi</title>
<style>
:root{color-scheme:dark;--bg:#090b12;--panel:#151b29;--line:#30394b;--gold:#f2b84b;--muted:#a7adbd}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:#f7f8fb;font-family:Arial,sans-serif}
main{width:min(760px,calc(100% - 32px));margin:35px auto}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:25px}
.brand{font-weight:800}.brand span{color:var(--gold)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:25px}
h1{font-size:25px;margin:0 0 8px}
p,.hint{color:var(--muted);line-height:1.5}
label{display:block;font-size:14px;font-weight:bold;margin:17px 0 8px}
input,textarea{width:100%;padding:13px;border:1px solid #3b4559;border-radius:10px;background:#0e1420;color:white;font:inherit}
input[type=file]{padding:12px}
textarea{min-height:90px;resize:vertical}
button{border:0;border-radius:10px;padding:13px 18px;background:var(--gold);color:#1a1408;font-weight:bold;cursor:pointer}
button.secondary{background:#283246;color:white;border:1px solid #46516a}
button:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:20px}
.hint{font-size:12px}
.status{display:none;margin-top:18px;padding:14px;border:1px solid var(--line);border-radius:10px;white-space:pre-wrap}
.status.show{display:block}
.hidden{display:none!important}
.error{color:#ffaaa3}.success{color:#a8e6bd}
a{color:var(--gold)}
#preview{display:none;margin-top:14px;max-width:220px;max-height:280px;object-fit:contain;border-radius:10px}
@media(max-width:520px){main{margin:20px auto}.panel{padding:18px}}
</style>
</head>
<body>
<main>
<div class="top">
<div class="brand">TEATER MINI <span>SIBI</span> · ADMIN</div>
<a href="/">Kembali ke situs</a>
</div>

<section id="loginPanel" class="panel">
<h1>Login Administrator</h1>
<p>Masuk untuk mengelola poster katalog film.</p>
<form id="loginForm">
<label for="password">Password administrator</label>
<input id="password" type="password" autocomplete="current-password" required>
<div class="row"><button type="submit">Masuk</button></div>
</form>
<div id="loginStatus" class="status"></div>
</section>

<section id="uploadPanel" class="panel hidden">
<h1>Upload Poster Film</h1>
<p>Tambahkan poster dan tautan Telegram untuk katalog Teater Mini Sibi.</p>

<form id="posterForm">
<label for="image">Pilih gambar poster</label>
<input id="image" type="file" accept="image/jpeg,image/png,image/webp" required>
<div class="hint">Format JPG, PNG, WebP. Maksimum 10 MB.</div>
<img id="preview" alt="Pratinjau poster">

<label for="title">Judul film</label>
<input id="title" type="text" maxlength="200" placeholder="Masukkan judul film" required>

<label for="category">Kategori film</label>
<input id="category" type="text" placeholder="Contoh: Drama, Komedi, Animasi" required>

<label for="description">Deskripsi film</label>
<textarea id="description" placeholder="Tuliskan deskripsi singkat film"></textarea>

<label for="telegramUrl">Tautan film Telegram</label>
<input id="telegramUrl" type="url" placeholder="https://t.me/..." required>

<div class="row">
<button id="uploadButton" type="submit">Simpan Poster</button>
<button id="logoutButton" class="secondary" type="button">Keluar</button>
</div>
</form>
<div id="uploadStatus" class="status" role="status"></div>
</section>
</main>

<script>
const loginPanel=document.getElementById("loginPanel");
const uploadPanel=document.getElementById("uploadPanel");
const loginStatus=document.getElementById("loginStatus");
const uploadStatus=document.getElementById("uploadStatus");
const uploadButton=document.getElementById("uploadButton");
const imageInput=document.getElementById("image");
const preview=document.getElementById("preview");

function showStatus(el,message,type=""){
  el.textContent=message;
  el.className="status show "+type;
}

function showLogin(loggedIn){
  loginPanel.classList.toggle("hidden",loggedIn);
  uploadPanel.classList.toggle("hidden",!loggedIn);
}

async function checkSession(){
  try{
    const r=await fetch("/api/admin/session",{credentials:"same-origin"});
    showLogin(r.ok);
  }catch{
    showLogin(false);
  }
}

document.getElementById("loginForm").addEventListener("submit",async e=>{
  e.preventDefault();
  showStatus(loginStatus,"Memeriksa password...");
  try{
    const r=await fetch("/api/admin/login",{
      method:"POST",
      credentials:"same-origin",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({
        password:document.getElementById("password").value
      })
    });
    const d=await r.json();
    if(!r.ok) throw new Error(d.error||"Login gagal.");
    document.getElementById("password").value="";
    showLogin(true);
  }catch(err){
    showStatus(loginStatus,err.message,"error");
  }
});

document.getElementById("logoutButton").addEventListener("click",async()=>{
  await fetch("/api/admin/logout",{
    method:"POST",
    credentials:"same-origin"
  });
  showLogin(false);
  showStatus(loginStatus,"Anda sudah keluar.");
});

imageInput.addEventListener("change",()=>{
  const file=imageInput.files[0];
  preview.style.display="none";
  if(!file)return;
  if(!["image/jpeg","image/png","image/webp"].includes(file.type)){
    showStatus(uploadStatus,"Format gambar harus JPG, PNG, atau WebP.","error");
    imageInput.value="";
    return;
  }
  if(file.size>10*1024*1024){
    showStatus(uploadStatus,"Ukuran gambar maksimal 10 MB.","error");
    imageInput.value="";
    return;
  }
  preview.src=URL.createObjectURL(file);
  preview.style.display="block";
});

document.getElementById("posterForm").addEventListener("submit",async e=>{
  e.preventDefault();

  const file=imageInput.files[0];
  if(!file){
    showStatus(uploadStatus,"Pilih gambar poster terlebih dahulu.","error");
    return;
  }

  const formData=new FormData();
  formData.append("image",file);
  formData.append("title",document.getElementById("title").value.trim());
  formData.append("category",document.getElementById("category").value.trim());
  formData.append("description",document.getElementById("description").value.trim());
  formData.append("telegram_url",document.getElementById("telegramUrl").value.trim());

  uploadButton.disabled=true;
  showStatus(uploadStatus,"Sedang mengunggah poster...");

  try{
    const r=await fetch("/api/posters/upload",{
      method:"POST",
      credentials:"same-origin",
      body:formData
    });

    const d=await r.json();
    if(!r.ok)throw new Error(d.error||"Upload poster gagal.");

    showStatus(uploadStatus,"Poster berhasil disimpan!","success");
    document.getElementById("posterForm").reset();
    preview.style.display="none";
  }catch(err){
    showStatus(uploadStatus,err.message||"Terjadi kesalahan saat upload.","error");
  }finally{
    uploadButton.disabled=false;
  }
});

checkSession();
</script>
</body>
</html>
